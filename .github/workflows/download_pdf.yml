name: NG pdf downloader

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: 'Google Drive View-Only PDF URL'
        required: true
        type: string

jobs:
  download-pdf:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Fast Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run PDF Downloader Script
      run: |
        python download_pdf.py "${{ github.event.inputs.drive_url }}"

    - name: Upload PDF as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Downloaded-PDF-Document
        path: downloaded_doc.pdf
        retention-days: 7
