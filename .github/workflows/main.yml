name: NG pdf downloader

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: 'Google Drive View-Only Link'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install selenium reportlab pillow

    - name: Run Downloader Script
      run: |
        python downloader.py "${{ github.event.inputs.drive_url }}"

    - name: Upload Artifact (ZIP Download)
      uses: actions/upload-artifact@v4
      with:
        name: NG-Downloaded-PDF
        path: output.pdf
